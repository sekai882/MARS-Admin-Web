<!DOCTYPE html>
<html th:replace="~{layout :: html(content=~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Estilos de Juego</h2>
        <a th:href="@{/estilos/nuevo}" class="btn btn-primary">Nuevo Estilo</a>
    </div>

    <div class="card p-4">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="estilo : ${estilos}">
                    <td th:text="${estilo.id}"></td>
                    <td th:text="${estilo.nombreEstilo}"></td>
                    <td th:text="${estilo.descripcion}"></td>
                    <td>
                        <a th:href="@{/estilos/editar/{id}(id=${estilo.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/estilos/eliminar/{id}(id=${estilo.id})}" class="btn btn-sm btn-danger" 
                           onclick="return confirm('¿Está seguro? Se eliminarán los jugadores asociados.')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
