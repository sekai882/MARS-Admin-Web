<!DOCTYPE html>
<html th:replace="~{layout :: html(content=~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Jugadores</h2>
        <a th:href="@{/jugadores/nuevo}" class="btn btn-primary">Nuevo Jugador</a>
    </div>

    <div class="card p-4">
        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Estilo de Juego</th>
                    <th>Valor Mercado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="jugador : ${jugadores}">
                    <td th:text="${jugador.id}"></td>
                    <td th:text="${jugador.nombre}"></td>
                    <td th:text="${jugador.edad}"></td>
                    <td th:text="${jugador.estiloJuego != null ? jugador.estiloJuego.nombreEstilo : 'Sin estilo'}"></td>
                    <td th:text="${#numbers.formatCurrency(jugador.valorMercado)}"></td>
                    <td>
                        <a th:href="@{/jugadores/editar/{id}(id=${jugador.id})}" class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/jugadores/eliminar/{id}(id=${jugador.id})}" class="btn btn-sm btn-danger" 
                           onclick="return confirm('¿Está seguro?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
