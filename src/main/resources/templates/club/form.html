<!DOCTYPE html>
<html th:replace="~{layout :: html(content=~{::section})}">
<body>
<section>
    <div class="card p-4">
        <h2 th:text="${club.id == null ? 'Nuevo Club' : 'Editar Club'}"></h2>
        <hr>
        <form th:action="@{/clubs/guardar}" th:object="${club}" method="post">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label class="form-label">Nombre del Club</label>
                <input type="text" th:field="*{nombreClub}" class="form-control" placeholder="Ej. Real Madrid">
            </div>

            <div class="mb-3">
                <label class="form-label">Presupuesto (€)</label>
                <input type="number" th:field="*{presupuesto}" class="form-control" 
                       th:classappend="${#fields.hasErrors('presupuesto')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('presupuesto')}" th:errors="*{presupuesto}"></div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">Guardar</button>
                <a th:href="@{/clubs}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
